[workspace]
members = [
  "crates/verify-core",
  "crates/verify-engine",
  "crates/verify-duckdb",
  "crates/verify-cli",
]
resolver = "2"

[workspace.package]
version = "0.7.6"
edition = "2024"
authors = ["CMD+RVL <engineering@cmdrvl.com>"]
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/cmdrvl/verify"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a number's text is read as the nearest f64. The default parser can be one
# step off, so a rule literal did not equal the same text in the data.
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
