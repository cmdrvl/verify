[package]
name = "verify-cli"
# Explicit, not `version.workspace = true`: spine-rules' r006_operator_version_matches_cargo_toml
# reads this file and rejects workspace-inherited versions. `tests/family_contract.rs`
# fails if it drifts from `[workspace.package] version` in the root Cargo.toml.
version = "0.7.6"
edition.workspace = true
authors.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description = "CLI entrypoint for verify"

[[bin]]
name = "verify"
path = "src/main.rs"

[[test]]
name = "cli"
path = "../../tests/cli.rs"

[[test]]
name = "redaction"
path = "../../tests/redaction.rs"

[[test]]
name = "grounding"
path = "../../tests/grounding.rs"

[[test]]
name = "xlsx_bindings"
path = "../../tests/xlsx_bindings.rs"

[[test]]
name = "doctor"
path = "../../tests/doctor.rs"

[[test]]
name = "golden_rules"
path = "../../tests/golden_rules.rs"

[[test]]
name = "family_contract"
path = "../../tests/family_contract.rs"

[[test]]
name = "perf_smoke"
path = "../../tests/perf_smoke.rs"

[[test]]
name = "released_parity"
path = "../../tests/released_parity.rs"

[[test]]
name = "determinism"
path = "../../tests/determinism.rs"

[[test]]
name = "portable_rules"
path = "../../tests/portable_rules.rs"

[[test]]
name = "refusals"
path = "../../tests/refusals.rs"

[[test]]
name = "binding_qualified_predicates"
path = "../../tests/binding_qualified_predicates.rs"

[[test]]
name = "binding_qualified_refusals"
path = "../../tests/binding_qualified_refusals.rs"

[[test]]
name = "binding_qualified_determinism"
path = "../../tests/binding_qualified_determinism.rs"

[dependencies]
clap.workspace = true
cmdrvl-core.workspace = true
duckdb = "1.4.4"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
verify-core = { path = "../verify-core" }
verify-duckdb = { path = "../verify-duckdb" }
verify-engine = { path = "../verify-engine" }

[dev-dependencies]
# Tests compute expected digests without going through cmdrvl-core.
sha2 = "0.10"
spine-rules = { git = "https://github.com/cmdrvl/spine-rules" }
tempfile = "3"
