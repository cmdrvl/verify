[package]
name = "verify-duckdb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Batch binding and query-rule surface for verify"

[[test]]
name = "query_rules"
path = "../../tests/query_rules.rs"

[[test]]
name = "lock_integration"
path = "../../tests/lock_integration.rs"

[dependencies]
duckdb = { version = "1.4.4", features = ["json", "parquet"] }
serde.workspace = true
serde_json.workspace = true
blake3 = "1.8"
cmdrvl-core.workspace = true
# Shared reader for Excel bindings. Pinned by rev; zstd (a C dependency for Parquet) is not
# needed because Parquet bindings go through DuckDB, not this crate.
cmdrvl-tabular = { git = "https://github.com/cmdrvl/tabular", rev = "f461f34d221cbce098857706afe51adbee0872f4", default-features = false }
csv = "1.4"
sha2 = "0.10"
tempfile = "3"
verify-core = { path = "../verify-core" }
verify-engine = { path = "../verify-engine" }
